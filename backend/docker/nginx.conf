worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # ── Apache backend ────────────────────────────────────────────────
    # Apache with mod_php runs on 8080 inside the container.
    # max_fails=0 prevents nginx from blacklisting the backend on transient errors.
    upstream php {
        server 127.0.0.1:8080 max_fails=0 fail_timeout=0;
        keepalive 32;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs visible via `docker logs`
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Optimized I/O settings
    sendfile on;
    sendfile_max_chunk 512k;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate limiting zones (shared across all workers)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/ld+json
        application/manifest+json
        application/vnd.geo+json
        application/font-woff
        application/font-woff2
        image/svg+xml
        image/x-icon;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    server {
        listen 80 default_server reuseport;
        listen [::]:80 default_server reuseport;
        server_name _;

        root /var/www/html/public;
        index index.php index.html;

        # ── Security headers ──────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        # ── Timeouts (generous — Neon cold starts can be slow) ────────
        proxy_connect_timeout   30s;
        proxy_send_timeout      120s;
        proxy_read_timeout      120s;
        send_timeout            120s;

        # ── Non-static requests → Apache ──────────────────────────────
        location / {
            try_files $uri @apache;
        }

        location @apache {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn 20;

            proxy_pass http://php;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect http://127.0.0.1:8080/ /;

            # Retry upstream on these errors before returning 502
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_intercept_errors off;
        }

        # ── Static Vite/Laravel assets (cached) ────────────────────────
        location /build/ {
            alias /var/www/html/public/build/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }

        # ── Static file cache (non-hashed but cacheable) ──────────────
        location /storage/ {
            alias /var/www/html/storage/app/public/;
            expires 1M;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Deny hidden files ──────────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ── Deny sensitive files ───────────────────────────────────────
        location ~ \.(env|log|sqlite|sqlite3)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
