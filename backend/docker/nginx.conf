events {
    worker_connections 1024;
}

http {
    # ── Apache backend ────────────────────────────────────────────────
    # Apache with mod_php runs on 8080 inside the container.
    # max_fails=0 prevents nginx from blacklisting the backend on transient errors.
    upstream php {
        server 127.0.0.1:8080 max_fails=0 fail_timeout=0;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs visible via `docker logs`
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript
              application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_proxied any;

    server {
        listen 80;
        server_name _;

        root /var/www/html/public;
        index index.php index.html;

        # ── Timeouts ──────────────────────────────────────────────────
        proxy_connect_timeout   10s;
        proxy_send_timeout      30s;
        proxy_read_timeout      30s;
        send_timeout            30s;

        # ── Non-static requests → Apache ──────────────────────────────
        location / {
            try_files $uri @apache;
        }

        location @apache {
            proxy_pass http://php;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect http://127.0.0.1:8080/ /;
            proxy_buffering off;

            # Retry upstream on these errors before returning 502
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_intercept_errors off;
        }

        # ── Static Vite/Laravel assets (cached) ────────────────────────
        location /build/ {
            alias /var/www/html/public/build/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        # ── Deny hidden files ──────────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
