events {
    worker_connections 1024;
}

http {
    upstream php {
        server 127.0.0.1:8080;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # ── Laravel public directory as document root ──────────────────────────
        root /var/www/html/public;
        index index.php index.html;

        # Gzip static assets
        gzip on;
        gzip_types text/plain text/css text/xml text/javascript
                  application/javascript application/json image/svg+xml;
        gzip_min_length 256;

        # ── Serve static files directly, proxy everything else to Apache ──────
        location / {
            try_files $uri @apache;
        }

        # ── Named location: all non-static requests → Apache/PHP ──────────────
        location @apache {
            proxy_pass http://php;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect http://127.0.0.1:8080/ /;
            proxy_buffering off;
        }

        # ── Static Vite/Laravel assets (cached) ──────────────────────────────
        location /build/ {
            alias /var/www/html/public/build/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        # ── Deny hidden files ─────────────────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
