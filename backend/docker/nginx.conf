upstream php {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name _;

    # ── Flutter web build (served at /) ────────────────────────────────────────
    # cd frontend && flutter build web --release → copied here at Docker build time
    root /var/www/html/build/web;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript
              application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # SPA fallback: any path that isn't a real file → index.html
    # (Flutter handles client-side routing internally)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite/Laravel frontend assets built by npm → cache forever
    location /build/ {
        alias /var/www/html/public/build/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # ── Laravel backend API routes ─────────────────────────────────────────────
    # /api/* routes are forwarded to the PHP/Apache backend which listens on 8080
    location /api/ {
        proxy_pass http://php;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;               # stream JSON responses in real time
    }

    # /dashboard and other Laravel web routes also go to Apache
    location /dashboard {
        proxy_pass http://php;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /login {
        proxy_pass http://php;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Static storage files
    location /storage/ {
        proxy_pass http://php;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Lottie / generated animation JSON assets
    location /lottie/ {
        proxy_pass http://php;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
        add_header Cache-Control "public";
    }
}
