services:
  - type: web
    name: sbkuapp
    env: docker
    rootDir: backend
    plan: free
    region: singapore
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_URL
        value: https://sbkuapp.onrender.com
      - key: APP_KEY
        value: base64:eOvGzttB2Sme3+YwJb7hse7ds1qCpwJ7HJ/KIdwHXKA=
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: AUTH_PROVIDER_DRIVER
        value: firestore
      - key: FIREBASE_PROJECT_ID
        value: sbkuapp-vert25
      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/firebase-credentials.json
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-credentials.json
      - key: GOOGLE_CLOUD_USE_REST
        value: "true"

