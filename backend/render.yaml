services:
  - type: web
    name: sbkuapp
    env: docker
    rootDir: backend
    plan: free
    region: singapore
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_URL
        value: https://sbkuapp.onrender.com
      - key: APP_KEY
        value: base64:eOvGzttB2Sme3+YwJb7hse7ds1qCpwJ7HJ/KIdwHXKA=
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: sbkuapp-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sbkuapp-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: sbkuapp-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sbkuapp-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sbkuapp-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FIREBASE_PROJECT_ID
        value: sbkuapp-vert25
      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/firebase-credentials.json
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-credentials.json
      - key: GOOGLE_CLOUD_USE_REST
        value: "true"

databases:
  - name: sbkuapp-db
    plan: free
    region: singapore
