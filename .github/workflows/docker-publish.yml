name: Build, Publish & Deploy Docker Image

on:
  push:
    branches: [main, dev, uat]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: sbku_app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Docker metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=uat,enable={{is_default_branch}}

      - name: Extract Docker metadata (ECR)
        id: meta-ecr
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=uat,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta-ecr.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ steps.meta-ecr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            ECR_REGISTRY="${{ steps.ecr.outputs.registry }}"
            IMAGE_URI="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:uat"
            CONTAINER_NAME="sbku-app"

            echo "=== Deploying $IMAGE_URI to EC2 ==="

            # ── 1. Setup swap if missing (prevents OOM on t3.micro) ──
            if ! swapon --show 2>/dev/null | grep -q .; then
              echo "Creating 1 GB swap file..."
              sudo dd if=/dev/zero of=/swapfile bs=1M count=1024 status=progress
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "Swap enabled"
            else
              echo "Swap already configured:"
              swapon --show
            fi

            # ── 2. Login to ECR ──
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin "${ECR_REGISTRY}"

            # ── 3. Pull new image ──
            docker pull "$IMAGE_URI"

            # ── 4. Force remove old container ──
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
            docker network prune -f 2>/dev/null || true

            # ── 5. Wait up to 30s for port 80 to be released ──
            echo "Waiting for port 80 to be released..."
            for i in $(seq 1 30); do
              if ! ss -tlnp 2>/dev/null | grep -q ':80 '; then
                echo "Port 80 is free (${i}s)"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "⚠ Port 80 still busy after 30s — forcing removal"
                docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
              fi
              sleep 1
            done

            # ── 6. Create env file if missing, fix ownership ──
            ENV_FILE="/opt/sbku-app.env"
            if [ ! -f "$ENV_FILE" ]; then
              echo "Creating $ENV_FILE ..."
              sudo tee "$ENV_FILE" > /dev/null << 'ENVEOF'
            NEON_DATABASE_URL="postgresql://neondb_owner:npg_PTQUFJLvd94h@ep-fragrant-recipe-a7rnwwa3.ap-southeast-2.aws.neon.tech/neondb?sslmode=require"
            APP_KEY=base64:qA+gNzOOJyERlAI2Qx1u7AK8j/pJ0npT5KMqaOl3sCE=
            APP_ENV=production
            APP_DEBUG=false
            APP_URL=http://localhost
            ENVEOF
            fi
            # Always ensure ec2-user can read it (fixes stale root-owned file)
            sudo chown ec2-user:ec2-user "$ENV_FILE" 2>/dev/null || true
            sudo chmod 600 "$ENV_FILE"

            # ── 7. Start new container with auto-restart ──
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 80:80 \
              -p 443:443 \
              --memory="768m" \
              --memory-reservation="512m" \
              --env-file "$ENV_FILE" \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              "$IMAGE_URI"

            # ── 8. Health check ──
            echo "Waiting for container to be ready..."
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://localhost/ > /dev/null 2>&1; then
                echo "✓ Container is healthy (HTTP 200)"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "⚠ Health check did not pass within 60s — check logs:"
                docker logs "$CONTAINER_NAME" --tail 30
              fi
            done

            echo "=== Deployment complete ==="


