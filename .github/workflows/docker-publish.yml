name: Build & Publish Docker Image

on:
  push:
    branches: [main, dev, uat]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: ap-southeast-2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Docker metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=uat,enable={{is_default_branch}}

      - name: Extract Docker metadata (ECR)
        id: meta-ecr
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ github.event.repository.name }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=uat,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta-ecr.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ steps.meta-ecr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Get EC2 instance ID
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/uat') && github.event_name != 'pull_request'
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=32.236.105.9" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No EC2 instance found with IP 32.236.105.9"
            exit 1
          fi
          echo "instance-id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found instance: $INSTANCE_ID"

      - name: Deploy to EC2 via SSM
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/uat') && github.event_name != 'pull_request'
        run: |
          REGION="${{ env.AWS_REGION }}"
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          REPO="${{ github.event.repository.name }}"
          SHA="${{ github.sha }}"
          INSTANCE_ID="${{ steps.ec2.outputs.instance-id }}"

          # Write deploy script with placeholders (printf avoids heredoc YAML issues)
          printf '%s\n' \
            '#!/bin/bash' \
            'set -e' \
            'aws ecr get-login-password --region __REGION__ | docker login --username AWS --password-stdin __REGISTRY__' \
            'docker pull __REGISTRY__/__REPO__:sha-__SHA__' \
            'docker tag __REGISTRY__/__REPO__:sha-__SHA__ __REGISTRY__/__REPO__:latest' \
            'docker tag __REGISTRY__/__REPO__:sha-__SHA__ __REGISTRY__/__REPO__:uat' \
            'docker stop sbku-backend 2>/dev/null || true' \
            'docker rm sbku-backend 2>/dev/null || true' \
            'docker run -d --name sbku-backend \' \
            '  -p 80:80 \' \
            '  -p 8080:8080 \' \
            '  --restart no \' \
            '  --memory=768m \' \
            '  --memory-reservation=512m \' \
            '  --env-file /home/ec2-user/.env.production \' \
            '  __REGISTRY__/__REPO__:sha-__SHA__' \
            'docker system prune -f || true' \
            > /tmp/deploy.sh

          # Substitute placeholders with actual values
          sed -i "s|__REGION__|$REGION|g" /tmp/deploy.sh
          sed -i "s|__REGISTRY__|$REGISTRY|g" /tmp/deploy.sh
          sed -i "s|__REPO__|$REPO|g" /tmp/deploy.sh
          sed -i "s|__SHA__|$SHA|g" /tmp/deploy.sh

          # Encode script as proper JSON parameter file (handles all escaping)
          python3 -c "import json; s=open('/tmp/deploy.sh').read(); open('/tmp/ssm-params.json','w').write(json.dumps({'commands':[s]}))"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --comment "Deploy sbku_app sha-$SHA" \
            --query "Command.CommandId" \
            --output text)
          echo "SSM command ID: $COMMAND_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i] Status: $STATUS"
            case "$STATUS" in
              Success) echo "Deployment succeeded!"; exit 0 ;;
              Failed|TimedOut|Cancelled)
                echo "Deployment failed: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for SSM command"
          exit 1
